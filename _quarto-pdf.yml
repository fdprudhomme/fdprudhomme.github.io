# Profil PDF — activé par `--profile pdf`, jamais par un `quarto render` nu.
#
# Ce bloc n'est PAS dans _quarto.yml à dessein. Un `format: pdf` déclaré au
# niveau du projet ferait rendre un PDF pour chacune des dix pages à chaque
# `quarto render` — y compris le glossaire de 18 000 mots — et le workflow
# GitHub, qui n'installe pas TinyTeX, échouerait avant de déployer le site.
# Le profil garde la configuration partagée en un seul endroit sans imposer
# le PDF au rendu courant.
#
# Usage : quarto render cv.qmd --to pdf --profile pdf

format:
  pdf:
    # LuaTeX est le moteur qui a produit le cv.pdf du 11 août sur cette
    # machine : c'est le seul dont on sache qu'il fonctionne ici. Il gère
    # nativement l'OpenType, donc mainfont ci-dessous.
    pdf-engine: lualatex

    # Palatino de la fonte libre TeX Gyre. C'est la fonte du cv anglais du
    # 9 août, celle qu'on cherche à retrouver. Couverture vérifiée sur les
    # caractères du site : ’ — – æ œ → ↓ ∈ sont tous présents.
    mainfont: "TeX Gyre Pagella"

    # KOMA-Script plutôt que article : titres et interlignage pensés pour le
    # document long, et parskip=half remplace le retrait d'alinéa par une
    # demi-ligne d'air — ce que veut une notice de CV, faite d'entrées brèves
    # et non de paragraphes courants.
    documentclass: scrartcl
    classoption:
      - 11pt
      - parskip=half

    # Letter : format des deux PDF existants et des dossiers nord-américains.
    papersize: letter

    # Pagella a un œil large ; à 11 pt, 6 pouces de justification donnent une
    # ligne d'environ 75 signes, la mesure lisible usuelle. D'où 1,25 pouce
    # de marge latérale plutôt qu'un pouce. Le bas est légèrement plus ample
    # que le haut pour loger le folio sans le coller au texte.
    geometry:
      - top=1in
      - bottom=1.1in
      - left=1.25in
      - right=1.25in

    # Liens colorés plutôt qu'encadrés, dans le $vert de styles.scss (#2F5D50,
    # aussi $link-color et $primary du site) : le PDF et le HTML signalent
    # l'hyperlien de la même couleur. Contraste 7,49:1 sur blanc.
    # Un PDF circule détaché du site : les cibles relatives des .qmd n'y
    # désignent rien. Le filtre les réécrit en URL absolues sur
    # fdprudhomme.com, en résolvant depuis le répertoire du document — sans
    # quoi « research.qmd » appelé depuis en/ pointerait vers la racine.
    filters:
      - outils/liens-absolus.lua
      - outils/titre-courant.lua

    # Pas de toc-title ici : sans valeur explicite, LaTeX emploie l'intitulé
    # localisé de sa langue — « Table des matières » sous lang: fr,
    # « Contents » sous lang: en. Un titre fixé dans ce profil partagé serait
    # dans une seule des deux langues.

    colorlinks: true
    linkcolor: vertfdp
    urlcolor: vertfdp
    citecolor: vertfdp
    include-in-header:
      text: |
        \usepackage{xcolor}
        \definecolor{vertfdp}{HTML}{2F5D50}

        % ─── Titres en romain ────────────────────────────────────────────
        % KOMA-Script compose tous les éléments de titre en sans-serif par
        % défaut. Sur un corps en Pagella, le contraste serif/sans est la
        % première cause de l'aspect « LaTeX brut » : Latin Modern Sans
        % n'appartient pas à la même famille et n'a pas été dessiné pour
        % l'accompagner. \addtokomafont ajoute \rmfamily à l'élément
        % « disposition », dont héritent titre, sections et sous-sections.
        \addtokomafont{disposition}{\rmfamily}

        % Hiérarchie explicite ensuite, élément par élément. \setkomafont
        % remplace la définition — d'où la répétition de \rmfamily.
        \setkomafont{title}{\rmfamily\bfseries\Huge}
        \setkomafont{subtitle}{\rmfamily\mdseries\large\itshape}
        \setkomafont{section}{\rmfamily\bfseries\Large}
        \setkomafont{subsection}{\rmfamily\bfseries\large}
        \setkomafont{subsubsection}{\rmfamily\bfseries\normalsize}

        % ─── Titre courant ───────────────────────────────────────────────
        % Un CV se lit désagrafé, page par page, souvent photocopié : chaque
        % feuillet doit porter le nom et sa place dans le tout. C'est l'usage
        % des dossiers académiques nord-américains, et la raison pour laquelle
        % le titre courant va en tête et non en pied — c'est le haut de page
        % qu'on regarde en feuilletant.
        \usepackage{scrlayer-scrpage}
        \usepackage{lastpage}
        \clearpairofpagestyles
        % La commande \ohead* elle-même est posée par outils/titre-courant.lua,
        % qui lit le champ `titre-courant` du document et se rabat sur
        % « Prud'homme » en son absence. Elle n'est pas écrite ici : ce profil
        % est partagé, et un titre courant nominatif ne convient qu'au CV.
        % Elle va en marge extérieure — à droite en recto simple, la colonne où
        % l'œil cherche une pagination — sous la forme « X — n/total » plutôt
        % que « n » seul, pour qu'une page isolée reste identifiable et qu'on
        % sache s'il en manque.
        % Petit corps et gris : le titre courant se consulte, il ne se lit pas.
        % Pas de filet de séparation — headsepline reste à false — le blanc
        % suffit à détacher la ligne du texte.
        \setkomafont{pageheadfoot}{\normalfont\small\color{black!60}}
        % Page de titre sans folio : elle porte déjà le nom en toutes lettres.
        \renewcommand*{\titlepagestyle}{empty}
        \pagestyle{scrheadings}

    # Pas de toc: false ici. Le toc des deux CV est déclaré au niveau du
    # document, qui l'emporte sur le projet ; il est donc restreint au format
    # html dans cv.qmd et en/cv.qmd. Rien n'active le toc pour le PDF, il
    # n'y en a donc pas — et le toc du glossaire n'est pas touché.
